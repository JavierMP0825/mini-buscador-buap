# Configuración de ejemplo para el VirtualHost de Apache que escucha en 8080.
# Ajusta las rutas si elegiste otro directorio de publicación.
<VirtualHost *:8080>
    ServerName buap-search.local
    DocumentRoot /var/www/html/mini-buscador-buap/public

    <Directory /var/www/html/mini-buscador-buap/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:5000/api/ retry=0
    ProxyPassReverse /api/ http://127.0.0.1:5000/api/

    ErrorLog ${APACHE_LOG_DIR}/mini-buscador-error.log
    CustomLog ${APACHE_LOG_DIR}/mini-buscador-access.log combined
</VirtualHost>
